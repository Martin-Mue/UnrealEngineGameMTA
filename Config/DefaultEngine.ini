[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/MTA6.MTA6GameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen (Software-Raytracing, laeuft auch ohne RT-Hardware), Nanite, Virtual Shadow Maps
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.SupportSkyAtmosphere=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Nanite.ProjectEnabled=True
; --- Ergaenzt fuer Ziel-GPU AMD RX 5700 XT (RDNA1, 8 GB, kein HW-Raytracing), Ziel 1080p/60 mit Upscaler ---
; Begruendung:
;  * Lumen nur Software-RT ueber Mesh-Distance-Fields (GenerateMeshDistanceFields oben); Mesh-SDF-Tracing an
;    (scharfe Gebaeudekanten), Async Compute hilft auf RDNA.
;  * Virtual Shadow Maps mit Cache (statische HISM-Gebaeude bleiben gecacht); LodBias +0.5 senkt die
;    Seitenanzahl deutlich bei kaum sichtbarem Verlust in 1080p.
;  * TSR als Upscaler (r.AntiAliasingMethod=4) mit 67 % Renderaufloesung ("Quality", intern ca. 1287x724 bei
;    1080p). FSR 3 waere ein externes AMD-Plugin (nicht Teil der Engine) und kann TSR spaeter ersetzen.
;    Dynamische Aufloesung ist vorbereitet, aber aus (erst nach Messung einschalten).
;  * Scalability-Empfehlung: Schatten/GI/Reflexionen "Hoch", Effekte/Nebel/Wolken "Mittel"; die Startwerte (sg.*)
;    gehoeren in GameUserSettings bzw. DefaultScalability.ini (MTASettingsUser), nicht in diese Datei.
r.AntiAliasingMethod=4

[SystemSettings]
; Allgemeine Render-CVars stehen hier (nicht in RendererSettings), damit sie sicher geladen werden.
r.Lumen.TraceMeshSDFs=1
r.Lumen.DiffuseIndirect.AsyncCompute=1
r.DistanceFields.MaxPerMeshResolution=128
r.SkyAtmosphere.FastSkyLUT=1
r.Shadow.Virtual.Cache=1
; Upscaling: 67 % Renderaufloesung, TSR-History in Ausgabeaufloesung (100 statt 200) spart VRAM und Zeit.
r.ScreenPercentage=67
r.TSR.History.ScreenPercentage=100
; Dynamische Aufloesung vorerst aus (0 = aus, 2 = immer an); Grenzen fuer spaeteres Einschalten.
r.DynamicRes.OperationMode=0
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
; Lumen: Screen-Probe-Gather Standarddichte, Reflexionen in halber Aufloesung.
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.Reflections.DownsampleFactor=2
; VSM: Seitenbudget senken.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
; Volumetrischer Nebel: grobere Froxel (Standard 8 px / 128 Schichten).
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
; Volumetrische Wolken ohne eigene Schattenkarte (teuer, ueber der Stadt kaum sichtbar).
r.VolumetricCloud.ShadowMap=0
