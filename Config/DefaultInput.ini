[/Script/Engine.InputSettings]
; MTA 6 nutzt Legacy-Achsen/-Aktionen (BindAxis/BindAction in AMTAVehiclePawn).
; Die Klassen werden explizit gesetzt, damit das aktivierte EnhancedInput-Plugin sie nicht ersetzt.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent

; Fahren
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Down)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Right)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Gamepad_LeftX)
+ActionMappings=(ActionName="Handbrake",Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="Reset",Key=R)
+ActionMappings=(ActionName="Reset",Key=Gamepad_FaceButton_Top)

; Spielstand
+ActionMappings=(ActionName="Save",Key=F5)
+ActionMappings=(ActionName="Load",Key=F9)

; Dialog: Entscheidungen 1-4, Weiter mit Enter
+ActionMappings=(ActionName="Choice1",Key=One)
+ActionMappings=(ActionName="Choice1",Key=NumPadOne)
+ActionMappings=(ActionName="Choice2",Key=Two)
+ActionMappings=(ActionName="Choice2",Key=NumPadTwo)
+ActionMappings=(ActionName="Choice3",Key=Three)
+ActionMappings=(ActionName="Choice3",Key=NumPadThree)
+ActionMappings=(ActionName="Choice4",Key=Four)
+ActionMappings=(ActionName="Choice4",Key=NumPadFour)
+ActionMappings=(ActionName="Confirm",Key=Enter)
+ActionMappings=(ActionName="Confirm",Key=Gamepad_FaceButton_Bottom)

; --- Zu Fuss (aus DefaultInputOnFoot.ini uebernommen) ---
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)
+AxisMappings=(AxisName="TurnRate",Scale=1.0,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.0,Key=Gamepad_RightY)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Sprint",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Crouch",Key=Gamepad_RightThumbstick)
+ActionMappings=(ActionName="WalkToggle",Key=LeftAlt)
+ActionMappings=(ActionName="Dodge",Key=LeftControl)
+ActionMappings=(ActionName="Dodge",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="ShoulderSwap",Key=Q)
+ActionMappings=(ActionName="ShoulderSwap",Key=Gamepad_DPad_Right)
+ActionMappings=(ActionName="EnterExitVehicle",Key=F)
+ActionMappings=(ActionName="EnterExitVehicle",Key=Gamepad_FaceButton_Top)
