; MTA 6 - Zusatz-Mappings fuer das Zu-Fuss-Paket (AMTACharacter, UMTAVehicleEntryComponent).
; Diese Zeilen werden spaeter vom Hauptagenten in Config/DefaultInput.ini uebernommen
; (Abschnitt [/Script/Engine.InputSettings]). Unreal liest diese Datei allein NICHT.
; Konflikte geprueft gegen DefaultInput.ini: W/S/A/D und Space sind dort Fahrzeug-Achsen/-Aktionen;
; das ist unkritisch, weil jeweils nur der besessene Pawn seine Namen bindet.
; Belegte Tasten dort: Up/Down/Left/Right, R, F5, F9, 1-4, Enter -> hier nicht verwendet.

[/Script/Engine.InputSettings]
; --- Bewegung (Achsen) ---
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=Gamepad_LeftX)

; --- Kamera ---
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)
+AxisMappings=(AxisName="TurnRate",Scale=1.0,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.0,Key=Gamepad_RightY)

; --- Aktionen zu Fuss ---
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Sprint",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Crouch",Key=Gamepad_RightThumbstick)
+ActionMappings=(ActionName="WalkToggle",Key=LeftAlt)
+ActionMappings=(ActionName="Dodge",Key=LeftControl)
+ActionMappings=(ActionName="Dodge",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="ShoulderSwap",Key=Q)
+ActionMappings=(ActionName="ShoulderSwap",Key=Gamepad_DPad_Right)

; --- Ein-/Aussteigen (wirkt zu Fuss UND im Fahrzeug ueber die gepushte Eingabe-Komponente) ---
+ActionMappings=(ActionName="EnterExitVehicle",Key=F)
+ActionMappings=(ActionName="EnterExitVehicle",Key=Gamepad_FaceButton_Top)
